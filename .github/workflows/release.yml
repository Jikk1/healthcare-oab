name: release

# Publishes production images to GHCR:
#   ghcr.io/jikk1/healthcare-oab/api  (backend/Dockerfile)
#   ghcr.io/jikk1/healthcare-oab/web  (frontend.Dockerfile)
# Tags: `latest` on main, `sha-<short>` always, `vX.Y.Z` on version tags.
# PR quality gates live in ci.yml / frontend-ci.yml; this workflow only
# builds and publishes what already passed review.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/healthcare-oab

jobs:
  publish:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            context: .
            dockerfile: frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository_owner may contain uppercase; GHCR requires lowercase.
          images: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
