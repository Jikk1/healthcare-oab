<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthCareOAB+ — Вход</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Адрес API. Поменяйте content, если бэкенд не на :8080. -->
  <meta name="hc-api-base" content="http://localhost:8080">
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-body">
  <a class="skip-link" href="#main">Перейти к форме входа</a>
  <div class="auth-glow" aria-hidden="true"></div>

  <main id="main" tabindex="-1">
    <form class="auth-card" id="loginForm" novalidate autocomplete="on">
      <div class="auth-brand"><span class="mark" aria-hidden="true">⚕</span> HealthCare<span>OAB+</span>
        <button type="button" class="btn btn-ghost btn-sm auth-lang" data-lang-toggle aria-label="Switch to English">EN</button>
      </div>
      <h1 data-i18n="login.h1">Вход в систему</h1>
      <p class="auth-sub" data-i18n="login.sub">Кабинет врача · предиктивная аналитика</p>

      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username"
               required placeholder="clinician@oab-clinic.demo" />
      </div>

      <div class="auth-field">
        <label for="password" data-i18n="login.pwd">Пароль</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required placeholder="••••••••••••" />
      </div>

      <div class="auth-field is-hidden" id="mfaField">
        <label for="mfaCode" data-i18n="login.mfa">Код из приложения (MFA)</label>
        <input id="mfaCode" name="mfaCode" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="000000" />
      </div>

      <div class="auth-error" id="authError" role="alert" hidden></div>

      <button class="btn btn-primary btn-lg auth-submit" type="submit" id="submitBtn" data-i18n="login.submit">Войти</button>

      <p class="auth-hint" data-i18n-html="login.hint">
        Демо-доступ: <code>clinician@oab-clinic.demo</code><br />
        пароль <code>OabDemo_Clinician_2026!</code>
      </p>
    </form>
  </main>

  <script src="/config.js"></script>
  <script type="module" src="/api.js"></script>
  <script type="module" src="/login.js"></script>
</body>
</html>
